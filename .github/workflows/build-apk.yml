name: Build BudgetBrain Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper if Missing
        working-directory: ./android
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          BUDGETBRAIN_API_BASE_URL: ${{ secrets.BUDGETBRAIN_API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ENABLE_BIOMETRIC_LOCK: ${{ secrets.ENABLE_BIOMETRIC_LOCK }}

      - name: Upload BudgetBrain APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetBrain-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-android
          name: "BudgetBrain Android App v1.0.0"
          body: "Official Native Android APK for BudgetBrain (Direct 1-Click Mobile Download)"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
